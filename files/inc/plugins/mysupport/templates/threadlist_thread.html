<tr class="{$thread['mySupportPriorityClass']}">

        <div>
            <span><a href="{$thread['threadlink']}">{$thread['subject']}</a></span>
            <div class="author smalltext">{$thread['profilelink']}</div>
        </div>
    </td>
    <td class="{$bgcolor}" width="25%">
        <a href="{$mybb->settings['bburl']}/{$forumUrl}">{$forumName}</a> <a
            href="{$mybb->settings['bburl']}/{$view_all_forum_link}">

    </td>
    <td class="{$bgcolor}" width="25%">{$status_time}</td>
    <td class="{$bgcolor}" width="20%" style="white-space: nowrap; text-align: right;">
		<span class="lastpost smalltext">{$lastposttime}<br/>
